# Cronologia de moviments (Font: informe del Tema 1, taula "Les nou etapes d'un cop d'ull").
# inici/final: anys orientatius. Les dècades ("1920s-1940s") s'han convertit a anys aproximats.
- nom: Romanticisme i Realisme
  inici: 1800
  final: 1850
  motor: Revolucions polítiques i industrials, naixement de la fotografia (1839)
  idea: Emoció i sublim; després, la realitat social sense idealitzar
- nom: Impressionisme
  inici: 1860
  final: 1880
  motor: Ciutat moderna, pintura en tub, tren, fotografia, estampes japoneses
  idea: Pinzellada visible, llum, angles inusuals, moviment
- nom: Postimpressionisme
  inici: 1880
  final: 1910
  motor: Esgotament de l'Impressionisme, ciència del color, colonialisme, fotografia de masses (Kodak, 1888)
  idea: Estructura, color simbòlic, expressió personal
- nom: Cubisme
  inici: 1907
  final: 1914
  motor: Llegat de Cézanne, art africà i ibèric, noves idees d'espai i temps, cinema
  idea: Formes fragmentades, perspectives múltiples
- nom: Dada
  inici: 1916
  final: 1924
  motor: Primera Guerra Mundial
  idea: Anti-art, absurditat, atzar
- nom: Surrealisme
  inici: 1920
  final: 1945
  motor: Psicoanàlisi de Freud, trauma de guerra, crisi de 1929
  idea: Lògica onírica, subconscient
- nom: Expressionisme abstracte
  inici: 1940
  final: 1959
  motor: Segona Guerra Mundial, exili europeu a Nova York, Guerra Freda
  idea: Gran format, gest
- nom: Minimalisme i Hard-edge
  inici: 1950
  final: 1969
  motor: Reacció contra el gest subjectiu, producció industrial
  idea: Simplicitat, geometria
- nom: Postmodernisme
  inici: 1960
  final: 2000
  motor: Societat de consum, mitjans de masses, feminisme, crisi dels grans relats
  idea: Crítica cultural, ironia, paròdia
