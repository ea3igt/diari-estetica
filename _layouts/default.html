<!doctype html>
<html lang="{{ site.lang | default: 'ca' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/estil.css' | relative_url }}">
</head>
<body>
  <header class="capcalera-lloc">
    <a class="nom-lloc" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="subtitol-lloc">{{ site.subtitle }}</span>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="peu-lloc">
    <p>{{ site.author }} · {{ site.subtitle }}</p>
  </footer>
  <script src="{{ '/assets/js/ampliar.js' | relative_url }}" defer></script>
</body>
</html>
